<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pendaftaran</title>
    <link rel="stylesheet" href="css/darftar.css">
</head>
<body>

    <section class="form-section">

        <div class="form-container">

            <h1>Pendaftaran Belajar Coding</h1>

            <p>
                Isi form di bawah untuk mulai belajar coding bersama kami.
            </p>

            <form>

                <input type="text" placeholder="Masukkan Nama" required>

                <input type="email" placeholder="Masukkan Email" required>
                
                <input type="tel" placeholder="Masukan No Telepon" required>

                <div class="materi-pilih">

                    <h3>Pilih Materi Yang Ingin Dipelajari</h3>

                    <label>
                        <input type="checkbox">
                        HTML
                    </label>

                    <label>
                        <input type="checkbox">
                        CSS
                    </label>

                    <label>
                        <input type="checkbox">
                        JavaScript
                    </label>

                </div>

                <button type="submit">
                    Daftar Sekarang
                </button>

            </form>

        </div>

    </section>
<script src="Js/daftar.js"></script>
</body>
</html>
